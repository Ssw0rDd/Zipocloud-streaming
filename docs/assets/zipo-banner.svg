<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
  <title id="title">ZiPo</title>
  <desc id="desc">Self-hosted streaming monorepo — catalog, player, profiles, cinema</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f0c"/>
      <stop offset="0.55" stop-color="#121812"/>
      <stop offset="1" stop-color="#0a0e0b"/>
    </linearGradient>
    <linearGradient id="line" x1="56" y1="0" x2="416" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7daa5a" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#7daa5a"/>
      <stop offset="1" stop-color="#a8d48a" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Static base — always visible on GitHub (animations are stripped/ignored there) -->
  <rect width="920" height="280" rx="32" fill="url(#bg)"/>
  <circle cx="820" cy="48" r="120" fill="#7daa5a" fill-opacity="0.08"/>
  <circle cx="60" cy="240" r="90" fill="#7daa5a" fill-opacity="0.05"/>

  <!-- Wordmark: Z (pistache) + ipo (white) -->
  <text
    x="56"
    y="128"
    font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="108"
    font-weight="800"
    letter-spacing="-4"
  >
    <tspan fill="#7daa5a">Z</tspan><tspan fill="#f5f8f3">ipo</tspan>
  </text>
  <circle cx="412" cy="52" r="11" fill="#7daa5a">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Tagline (static — no zero-width clip that hides text on GitHub) -->
  <text
    x="56"
    y="196"
    font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="24"
    font-weight="500"
    fill="#c5d4c0"
  >Self-hosted streaming · catalog · player · cinema</text>

  <!-- Underline accent -->
  <rect x="56" y="214" width="360" height="3" rx="2" fill="url(#line)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Blinking cursor (optional accent; does not hide content) -->
  <rect x="688" y="176" width="3" height="26" fill="#7daa5a">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text
    x="56"
    y="250"
    font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="15"
    fill="#6f7f6b"
  >Open monorepo · Next.js · Bun · Elysia · PostgreSQL</text>
</svg>

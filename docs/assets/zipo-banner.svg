<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
  <title id="title">ZiPo</title>
  <desc id="desc">Self-hosted streaming monorepo  catalog, player, profiles, cinema</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f0c"/>
      <stop offset="55%" stop-color="#121812"/>
      <stop offset="100%" stop-color="#0a0e0b"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7daa5a" stop-opacity="0"/>
      <stop offset="40%" stop-color="#7daa5a"/>
      <stop offset="100%" stop-color="#a8d48a" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="56" y="168" width="0" height="40">
        <animate attributeName="width" values="0;720;720;0" keyTimes="0;0.35;0.85;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="920" height="280" rx="32" fill="url(#bg)"/>
  <circle cx="820" cy="48" r="120" fill="#7daa5a" opacity="0.06"/>
  <circle cx="60" cy="240" r="90" fill="#7daa5a" opacity="0.04"/>

  <!-- Wordmark: Z (pistache) + ipo (white) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="0.96;1;1" keyTimes="0;0.18;1" dur="8s" repeatCount="indefinite" additive="sum"/>
    <text
      x="56"
      y="128"
      font-family="ui-rounded, 'Segoe UI', system-ui, sans-serif"
      font-size="108"
      font-weight="800"
      letter-spacing="-0.045em"
    >
      <tspan fill="#7daa5a">Z</tspan><tspan fill="#f5f8f3">ipo</tspan>
    </text>
    <circle cx="412" cy="52" r="11" fill="#7daa5a">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Typewriter tagline -->
  <g clip-path="url(#typeClip)">
    <text
      x="56"
      y="196"
      font-family="'Segoe UI', system-ui, sans-serif"
      font-size="24"
      font-weight="500"
      fill="#c5d4c0"
    >Self-hosted streaming · catalog · player · cinema</text>
  </g>

  <!-- Cursor -->
  <rect x="56" y="174" width="3" height="28" fill="#7daa5a" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.35;0.42;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x" values="56;776;776;56" keyTimes="0;0.35;0.85;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Underline sweep -->
  <rect x="56" y="214" height="3" rx="2" fill="url(#line)" width="0">
    <animate attributeName="width" values="0;360;360;0" keyTimes="0;0.4;0.88;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text
    x="56"
    y="250"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="15"
    fill="#6f7f6b"
  >Open monorepo · Next.js · Bun · Elysia · PostgreSQL</text>
</svg>

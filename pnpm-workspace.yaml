packages:
  - "apps/*"
  - "packages/*"

# Delay newly-published packages and reject exotic transitive sources.
minimumReleaseAge: 1440
blockExoticSubdeps: true

# Keep security-sensitive transitive dependencies on patched versions.
# pnpm reads workspace settings from this file (not package.json).
overrides:
  esbuild: 0.25.12
  postcss: 8.5.25
  sharp: 0.35.3
  "brace-expansion@1": 1.1.18
  "brace-expansion@5": 5.0.9
  "js-yaml@4": 4.3.1
  "nanoid@3": 3.3.18

# These optional/native packages ship prebuilt binaries in optional
# dependencies. Their lifecycle scripts only validate/download fallbacks;
# the project builds and tests successfully without executing them.
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - esbuild
  - unrs-resolver

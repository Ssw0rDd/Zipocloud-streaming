services:
  postgres:
    image: postgres:16.14-alpine3.23
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zipo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zipo}
    volumes:
      - zipo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zipo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zipo-internal

  redis:
    image: redis:7.4.10-alpine3.21
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # Cache + queue share Redis; authentication is mandatory in production.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - zipo_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zipo-internal

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - zipo_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - zipo-internal

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-zipo-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    networks:
      - zipo-internal

  api:
    image: zipo-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    # Horizontal scale (job leader election via Redis):
    #   docker compose -f docker-compose.prod.yml up -d --scale api=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-zipo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zipo}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      API_URL: ${API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # The API is reachable only through the internal Nginx service, which
      # overwrites forwarding headers with the observed client address.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      VIEWS_FLUSH_INTERVAL_MS: ${VIEWS_FLUSH_INTERVAL_MS:-30000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      # Catalog/extractors off by default — authorized-media + secure embeds only.
      SUPERFLIX_ENABLED: ${SUPERFLIX_ENABLED:-false}
      SUPERFLIX_BASE_URL: ${SUPERFLIX_BASE_URL:-https://superflixapi.pro}
      WAREZCDN_ENABLED: ${WAREZCDN_ENABLED:-false}
      WAREZCDN_BASE_URL: ${WAREZCDN_BASE_URL:-https://warezcdn.lat}
      MEGAFRIX_ENABLED: ${MEGAFRIX_ENABLED:-false}
      MEGAFRIX_BASE_URL: ${MEGAFRIX_BASE_URL:-https://provider.example.com}
      MEGAFRIX_APP_PATH: ${MEGAFRIX_APP_PATH:-/}
      VIDEASY_ENABLED: ${VIDEASY_ENABLED:-false}
      VIDEASY_BASE_URL: ${VIDEASY_BASE_URL:-https://player.videasy.net}
      VIDKING_ENABLED: ${VIDKING_ENABLED:-false}
      VIDKING_BASE_URL: ${VIDKING_BASE_URL:-https://www.vidking.net}
      VIDLINK_ENABLED: ${VIDLINK_ENABLED:-false}
      VIDLINK_BASE_URL: ${VIDLINK_BASE_URL:-https://vidlink.pro}
      VIDSRC_ENABLED: ${VIDSRC_ENABLED:-false}
      VIDSRC_BASE_URL: ${VIDSRC_BASE_URL:-https://vidsrc.win}
      SUPERFLIX_SYNC_INTERVAL_MS: ${SUPERFLIX_SYNC_INTERVAL_MS:-3600000}
      SUPERFLIX_CATALOG_MAX_AGE_MS: ${SUPERFLIX_CATALOG_MAX_AGE_MS:-7200000}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY:-}
      SEARCH_V2_ENABLED: ${SEARCH_V2_ENABLED:-true}
      PLAYBACK_V2_ENABLED: ${PLAYBACK_V2_ENABLED:-true}
      NATIVE_PLAYER_ONLY: ${NATIVE_PLAYER_ONLY:-true}
      SECURE_EMBED_FALLBACK_ENABLED: ${SECURE_EMBED_FALLBACK_ENABLED:-false}
      OWN_PREROLL_ENABLED: ${OWN_PREROLL_ENABLED:-false}
      ADS_ENABLED: ${ADS_ENABLED:-false}
      # Product flag is independent from the process role below.
      CLIPS_ENABLED: ${CLIPS_ENABLED:-false}
      CINEMA_ENABLED: ${CINEMA_ENABLED:-false}
      # API replicas must NOT run FFmpeg — workers own MEDIA_WORKER_ENABLED=true.
      MEDIA_WORKER_ENABLED: "false"
      MEDIA_PREPARATION_ENABLED: ${MEDIA_PREPARATION_ENABLED:-false}
      PLAYBACK_SESSION_TTL_SECONDS: ${PLAYBACK_SESSION_TTL_SECONDS:-600}
      PLAYBACK_SESSION_SECRET: ${PLAYBACK_SESSION_SECRET}
      OWN_PREROLL_URL: ${OWN_PREROLL_URL:-/zipo-preroll.webm}
      OWN_PREROLL_SKIP_SECONDS: ${OWN_PREROLL_SKIP_SECONDS:-5}
      OWN_PREROLL_FREQUENCY_SECONDS: ${OWN_PREROLL_FREQUENCY_SECONDS:-1800}
      CINEMA_ROOM_IDLE_HOURS: ${CINEMA_ROOM_IDLE_HOURS:-24}
      CINEMA_MAX_PARTICIPANTS: ${CINEMA_MAX_PARTICIPANTS:-50}
      CINEMA_ACCESS_SECRET: ${CINEMA_ACCESS_SECRET}
      AUTHORIZED_MEDIA_ENABLED: ${AUTHORIZED_MEDIA_ENABLED:-false}
      AUTHORIZED_MEDIA_RESOLVER_URL: ${AUTHORIZED_MEDIA_RESOLVER_URL:-}
      AUTHORIZED_MEDIA_RESOLVER_SECRET: ${AUTHORIZED_MEDIA_RESOLVER_SECRET:-}
      AUTHORIZED_MEDIA_ORIGINS: ${AUTHORIZED_MEDIA_ORIGINS:-}
      AUTHORIZED_MEDIA_TIMEOUT_MS: ${AUTHORIZED_MEDIA_TIMEOUT_MS:-5000}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-zipo-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      INTERNAL_API_URL: http://api:3001
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      CLIP_QUEUE_MAX_DEPTH: ${CLIP_QUEUE_MAX_DEPTH:-200}
      PREPARATION_QUEUE_MAX_DEPTH: ${PREPARATION_QUEUE_MAX_DEPTH:-100}
      PROTECTED_STREAM_ENABLED: ${PROTECTED_STREAM_ENABLED:-false}
      PROTECTED_STREAM_MASTER_SECRET: ${PROTECTED_STREAM_MASTER_SECRET:-}
      PROTECTED_STREAM_ROOT: /data/protected-streams
      STREAM_BRIDGE_ENABLED: ${STREAM_BRIDGE_ENABLED:-false}
      STREAM_BRIDGE_URL: http://stream-bridge:8090
      STREAM_BRIDGE_SECRET: ${STREAM_BRIDGE_SECRET:-}
    volumes:
      - ${PROTECTED_STREAM_ROOT_HOST:-./data/protected-streams}:/data/protected-streams:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - zipo-internal

  media-worker:
    image: zipo-api:local
    profiles: ["media-worker"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    command: ["bun", "run", "dist/media-worker.js"]
    # Scale: docker compose -f docker-compose.prod.yml --profile media-worker up -d --scale media-worker=2
    # Optional GPU: set FFMPEG_HWACCEL=nvenc and attach nvidia runtime on the host.
    depends_on:
      api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-zipo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zipo}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      API_URL: ${API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      MEDIA_WORKER_ENABLED: "true"
      CLIPS_ENABLED: ${CLIPS_ENABLED:-false}
      MEDIA_PREPARATION_ENABLED: ${MEDIA_PREPARATION_ENABLED:-false}
      MEGAFRIX_ENABLED: "false"
      SUPERFLIX_ENABLED: "false"
      WAREZCDN_ENABLED: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-zipo-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      INTERNAL_API_URL: http://api:3001
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      FFMPEG_HWACCEL: ${FFMPEG_HWACCEL:-auto}
      CLIP_QUEUE_MAX_DEPTH: ${CLIP_QUEUE_MAX_DEPTH:-200}
      PREPARATION_QUEUE_MAX_DEPTH: ${PREPARATION_QUEUE_MAX_DEPTH:-100}
      MEDIA_CACHE_TTL_SECONDS: ${MEDIA_CACHE_TTL_SECONDS:-21600}
      MEDIA_SOURCE_ENCRYPTION_KEY: ${MEDIA_SOURCE_ENCRYPTION_KEY:-}
      PLAYBACK_SESSION_SECRET: ${PLAYBACK_SESSION_SECRET}
    networks:
      - zipo-internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
        NEXT_PUBLIC_CINEMA_ENABLED: ${CINEMA_ENABLED:-false}
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=256m
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_URL: http://api:3001
      NEXT_PUBLIC_CINEMA_ENABLED: ${CINEMA_ENABLED:-false}
    networks:
      - zipo-internal

  stream-bridge:
    profiles: ["stream-bridge"]
    build:
      context: ./services/zipo-stream-bridge
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      STREAM_BRIDGE_SECRET: ${STREAM_BRIDGE_SECRET}
      STREAM_BRIDGE_JOB_DB: /data/jobs.sqlite3
      STREAM_BRIDGE_MAX_ACTIVE_JOBS: ${STREAM_BRIDGE_MAX_ACTIVE_JOBS:-32}
      STREAM_BRIDGE_MAX_JOB_RECORDS: ${STREAM_BRIDGE_MAX_JOB_RECORDS:-2000}
      STREAM_BRIDGE_WORKERS: ${STREAM_BRIDGE_WORKERS:-2}
      STREAM_BRIDGE_ALLOWED_MEDIA_HOSTS: ${STREAM_BRIDGE_ALLOWED_MEDIA_HOSTS:-}
      SUPERFLIX_ENABLED: ${SUPERFLIX_ENABLED:-false}
      SUPERFLIX_BASE_URL: ${SUPERFLIX_BASE_URL:-https://superflixapi.pro}
      WAREZCDN_ENABLED: ${WAREZCDN_ENABLED:-false}
      WAREZCDN_BASE_URL: ${WAREZCDN_BASE_URL:-https://warezcdn.lat}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-zipo-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      MEDIA_CACHE_TTL_SECONDS: ${MEDIA_CACHE_TTL_SECONDS:-21600}
    volumes:
      - zipo_stream_bridge_jobs:/data
    networks:
      - zipo-internal

  nginx:
    image: nginx:1.31.3-alpine
    restart: always
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./secrets/tls}:/etc/nginx/tls:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      - api
      - web
    networks:
      - zipo-internal

volumes:
  zipo_pg_data:
  zipo_redis_data:
  zipo_minio_data:
  zipo_stream_bridge_jobs:

networks:
  zipo-internal:
    driver: bridge

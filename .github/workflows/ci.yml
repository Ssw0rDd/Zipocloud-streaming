name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://zipo:zipo@localhost:5432/zipo
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16.14-alpine3.23
        env:
          POSTGRES_DB: zipo
          POSTGRES_USER: zipo
          POSTGRES_PASSWORD: zipo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zipo -d zipo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.10-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/zipo-stream-bridge/requirements.txt
            services/zipo-stream-bridge/requirements-dev.txt

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate supply-chain policy
        run: pnpm check:supply-chain

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Validate translations
        run: pnpm --filter @zipo/web validate-i18n

      - name: Run security tests
        run: pnpm test:security

      - name: Run static pentest controls
        run: pnpm pentest:static

      - name: Run all API tests
        run: pnpm --filter @zipo/api test

      - name: Run public SDK tests
        run: pnpm test:sdk

      - name: Install Stream Bridge dependencies
        run: python -m pip install --disable-pip-version-check -r services/zipo-stream-bridge/requirements-dev.txt

      - name: Run Stream Bridge tests
        working-directory: services/zipo-stream-bridge
        run: python -m pytest tests -q && python -m pip check

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build production artifacts
        run: pnpm build

      - name: Audit browser artifacts
        run: pnpm check:artifacts

      - name: Enforce browser bundle budgets
        run: pnpm --filter @zipo/web check:bundle

      - name: Install Playwright Chromium
        run: pnpm --filter @zipo/web exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm --filter @zipo/web test:e2e

      - name: Run NSFW storefront browser tests
        run: pnpm --filter @zipo/web exec playwright test nsfw.spec.ts
        env:
          E2E_NSFW: "true"

      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

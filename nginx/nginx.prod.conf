worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $uri $zipo_access_loggable {
        default 1;
        ~^/api/v1/cinema/ws$ 0;
        ~^/api/v1/playback/sessions/[^/]+/stream/ 0;
        ~^/api/v1/playback/media/(authorized|megafrix)/ 0;
        ~^/api/v2/playback/preparations/ 0;
        ~^/api/stream/ 0;
    }

    log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent request_id=$request_id '
                    'referer="$http_referer" agent="$http_user_agent"';
    access_log /dev/stdout main if=$zipo_access_loggable;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    resolver 127.0.0.11 ipv6=off valid=10s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml application/vnd.api+json;

    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

    upstream zipo_api {
        least_conn;
        server api:3001;
        keepalive 32;
    }
    upstream zipo_web {
        least_conn;
        server web:3000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 4m;
        limit_conn per_ip 40;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /_next/static/ {
            proxy_pass http://zipo_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location = /api/v1/cinema/ws {
            access_log off;
            proxy_pass http://zipo_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }

        location /api/auth/ {
            limit_req zone=auth_per_ip burst=5 nodelay;
            proxy_pass http://zipo_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Connection "";
        }

        location /api/ {
            proxy_pass http://zipo_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Connection "";
        }

        location /health {
            proxy_pass http://zipo_api/health;
            proxy_http_version 1.1;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://zipo_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # These routes carry short-lived bearer-style tokens in the path or query.
    # Keep them out of persistent access logs while retaining all other logs.
    map $uri $zipo_access_loggable {
        default 1;
        ~^/api/v1/cinema/ws$ 0;
        ~^/api/v1/playback/sessions/[^/]+/stream/ 0;
        ~^/api/v1/playback/media/(authorized|megafrix)/ 0;
        ~^/api/v2/playback/preparations/ 0;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main if=$zipo_access_loggable;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Docker embedded DNS — re-resolve scaled api/web replicas
    resolver 127.0.0.11 ipv6=off valid=10s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml application/vnd.api+json;

    # Brotli — enable when ngx_brotli module is available
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    upstream zipo_api {
        least_conn;
        server api:3001;
        keepalive 32;
    }

    upstream zipo_web {
        least_conn;
        server web:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 4m;

        # Static assets — long cache
        location /_next/static/ {
            proxy_pass http://zipo_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location /static/ {
            proxy_pass http://zipo_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=86400";
        }

        # One-time Cinema ticket is a query parameter: never persist it in access logs.
        location = /api/v1/cinema/ws {
            access_log off;
            proxy_pass http://zipo_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }

        # API proxy (preserves /api/v1 and /api/auth paths)
        location /api/ {
            proxy_pass http://zipo_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Connection "";
        }

        # Health check
        location /health {
            proxy_pass http://zipo_api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Web app (Next.js)
        location / {
            proxy_pass http://zipo_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}

services:
  postgres:
    image: postgres:16.14-alpine3.23
    container_name: zipo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zipo
      POSTGRES_PASSWORD: zipo
      POSTGRES_DB: zipo
    ports:
      - "5434:5432"
    volumes:
      - zipo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zipo -d zipo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.10-alpine3.21
    container_name: zipo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zipo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: zipo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zipo_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-zipo-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"

  stream-bridge:
    profiles: ["stream-bridge"]
    build:
      context: ./services/zipo-stream-bridge
    container_name: zipo-stream-bridge
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    env_file:
      - .env
    environment:
      STREAM_BRIDGE_HOST: 0.0.0.0
      STREAM_BRIDGE_PORT: 8090
      INTERNAL_API_URL: http://host.docker.internal:3001
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8090:8090"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  zipo_pg_data:
  zipo_redis_data:
  zipo_minio_data:
